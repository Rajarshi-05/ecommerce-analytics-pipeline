# The chart palette was validated against this one surface (#fcfcfb). Pinning
# the theme keeps what renders identical to what was checked, rather than
# shipping an unvalidated dark variant.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false
